<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopKart: Online shopping</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { display: flex; gap: 20px; padding: 12px 20px; background: #232f3e; color: white; }
    main { padding: 20px; }
    .product { margin: 10px 0; }
  </style>
</head>
<body>
  <header>
    <span>Hello, Asha</span>
    <span>Deliver to Asha, Bengaluru 560001</span>
    <input type="search" aria-label="Search ShopKart" placeholder="Search ShopKart">
  </header>
  <main>
    <h1>Deals of the day</h1>
    <div class="product">Cricket bat signed by Virat Kohli, ₹12,499</div>
    <div class="product">Harry Potter box set by J.K. Rowling, ₹3,299</div>
    <div class="product">Biography of A.P.J. Abdul Kalam, ₹399</div>
  </main>
</body>
</html>
