<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skrim form test fixture</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 0 auto; padding: 20px; line-height: 1.5; }
    section, form { margin-bottom: 24px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
    textarea { min-height: 80px; }
    button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
    #status { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Contact support</h1>
  <p>Self-contained fixture for testing form filling and PII redaction. All personal data on this page is made up.</p>

  <section aria-label="Your account">
    <h2>Your account</h2>
    <p>Signed in as <strong id="account-email">asha.rao@example.com</strong></p>
    <p>Phone on file: <span id="account-phone">+91 98765 43210</span></p>
  </section>

  <form id="contact">
    <h2>Write to us</h2>
    <label for="name">Full name</label>
    <input id="name" autocomplete="name">

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">

    <label for="phone">Phone (optional)</label>
    <input id="phone" type="tel" autocomplete="tel">

    <label for="topic">Topic</label>
    <select id="topic">
      <option>Choose one</option>
      <option>Billing</option>
      <option>Delivery</option>
      <option>Something else</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message"></textarea>

    <button type="submit">Send message</button>
  </form>

  <p id="status" role="status"></p>

  <script>
    const form = document.getElementById('contact');
    const status = document.getElementById('status');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      status.textContent = email && message
        ? 'Thanks, your message was sent. We will reply by email.'
        : 'Please fill in your email and a message.';
    });
  </script>
</body>
</html>
