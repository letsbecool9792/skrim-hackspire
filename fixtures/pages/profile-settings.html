<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 20px; }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input, select { width: 100%; padding: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
  <p>Welcome back, Asha</p>
  <h1>Profile settings</h1>
  <form>
    <label for="name">Full name</label>
    <input id="name" autocomplete="name" value="Asha Rao">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" value="asha.rao@example.com">
    <label for="phone">Mobile</label>
    <input id="phone" type="tel" autocomplete="tel" value="+91 98765 43210">
    <label for="dob">Date of birth</label>
    <input id="dob" autocomplete="bday" value="1994-03-12">
    <label for="street">Address</label>
    <input id="street" autocomplete="street-address" value="12 MG Road">
    <label for="city">City</label>
    <input id="city" autocomplete="address-level2" value="Bengaluru">
    <label for="pin">PIN code</label>
    <input id="pin" autocomplete="postal-code" value="560001">
    <label for="pan">PAN</label>
    <input id="pan" value="ABCDE1234F">
    <label for="language">Language</label>
    <select id="language"><option selected>English</option><option>हिन्दी</option></select>
    <button type="submit">Save changes</button>
  </form>
  <h2>Notification settings</h2>
</body>
</html>
