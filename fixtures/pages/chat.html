<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messages</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 20px; }
    .message { margin: 8px 0; padding: 8px 12px; border-radius: 12px; background: #f1f1f1; }
  </style>
</head>
<body>
  <h1>Karan Mehta</h1>
  <p>Online</p>
  <div class="message">Are you coming to the reunion on Saturday?</div>
  <div class="message">Yes! Send me the address, Karan.</div>
  <div class="message">45 Residency Road, Bengaluru 560025. Call +91 98111 22334 if you get lost.</div>
  <div class="message">Great, see you there. Meera</div>
  <p>Today 9:41</p>
  <textarea aria-label="Type a message"></textarea>
  <button>Send</button>
</body>
</html>
