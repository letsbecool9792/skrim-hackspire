name: verify

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs so a rapid push sequence does not queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The root package.json has a
      # "packageManager": "pnpm@x.y.z" field, and action-setup HARD FAILS if the
      # version is specified in both places. package.json wins because it also
      # pins the version for everyone locally.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Invariants first: these are the rules that cost us the project rather
      # than a bug, and they run in under a second. Fail fast on them.
      - name: Invariants
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Model weights are gitignored, so nothing above may depend on them.
      # If a check starts needing public/models/, it belongs in a job that
      # runs `pnpm models:fetch` first - not silently added here.
