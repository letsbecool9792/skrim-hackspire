name: release-extension

# Builds the Chrome extension and publishes it as a GitHub Release when a
# version tag is pushed:
#
#   git tag v0.3.0
#   git push origin v0.3.0
#
# The asset is always named skrim-chrome.zip, so the landing page's link
# (releases/latest/download/skrim-chrome.zip) always gets the newest one.
#
# The build talks to the hosted planner and the hosted dashboard, not to
# localhost: set the repository variables SKRIM_SERVER_URL (the server's Vercel URL)
# and WXT_DASHBOARD_URL (the dashboard's Vercel URL) first, under Settings →
# Secrets and variables → Actions → Variables. Without them the release
# stops, rather than ship a zip that only works on our laptops.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # to create the release and upload the zip

    env:
      SKRIM_SERVER_URL: ${{ vars.SKRIM_SERVER_URL }}
      WXT_DASHBOARD_URL: ${{ vars.WXT_DASHBOARD_URL }}
      # Nothing calls the icon detector yet, and exporting it means ten
      # minutes of Python setup on every release.
      SKRIM_SKIP_ICON: "1"

    steps:
      - name: Check the hosted URLs are set
        run: |
          if [ -z "$SKRIM_SERVER_URL" ] || [ -z "$WXT_DASHBOARD_URL" ]; then
            echo "::error::Set the repository variables SKRIM_SERVER_URL (the planner) and WXT_DASHBOARD_URL (the dashboard) first."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome shows the manifest's version on chrome://extensions; take it
      # from the tag (v0.3.0 -> 0.3.0) instead of package.json's 0.0.0.
      - name: Stamp the version
        working-directory: apps/extension
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # Fetches the on-device models, then wxt zip writes
      # apps/extension/.output/<name>-<version>-chrome.zip.
      - name: Build the extension zip
        working-directory: apps/extension
        run: pnpm zip

      - name: Name the zip
        run: cp "$(ls apps/extension/.output/*-chrome.zip | head -1)" skrim-chrome.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: skrim-chrome.zip
          name: "Skrim ${{ github.ref_name }}"
          make_latest: true
          generate_release_notes: true
          body: |
            ## Install

            Skrim is not on the Chrome Web Store yet.

            1. Download **skrim-chrome.zip** below and unzip it.
            2. Open **chrome://extensions** in Chrome.
            3. Turn on **Developer mode** (top right).
            4. Click **Load unpacked** and choose the unzipped folder.
            5. Open any page and click Skrim's toolbar button.

            It plans with our hosted server, which is on a free tier shared by everyone
            trying it: a few steps a minute. To watch what the server receives, open the
            dashboard: ${{ vars.WXT_DASHBOARD_URL }}

            Firefox is not supported yet. To build from source, see the
            [README](https://github.com/letsbecool9792/skrim-hackspire#readme).
