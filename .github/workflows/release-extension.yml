name: release-extension

# Builds the Chrome extension and publishes it as a GitHub Release when a
# version tag is pushed:
#
#   git tag v0.3.0
#   git push origin v0.3.0
#
# The assets always have the same names, so "releases/latest/download/<name>"
# always gets the newest: skrim-chrome.zip, skrim-firefox.zip (unsigned: loads
# as a temporary add-on), and skrim-firefox.xpi (signed by Mozilla, installs
# for good on Firefox and Firefox for Android) when the repository secrets
# AMO_API_KEY and AMO_API_SECRET are set: addons.mozilla.org → Developer Hub →
# Manage API Keys.
#
# The build talks to the hosted planner and the hosted dashboard on Vercel,
# not to localhost. To point a release elsewhere, set the repository variables
# SKRIM_SERVER_URL and WXT_DASHBOARD_URL (Settings → Secrets and variables →
# Actions → Variables); they override the defaults below.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # to create the release and upload the zip

    env:
      SKRIM_SERVER_URL: ${{ vars.SKRIM_SERVER_URL || 'https://skrim-server.vercel.app' }}
      WXT_DASHBOARD_URL: ${{ vars.WXT_DASHBOARD_URL || 'https://skrim-dashboard.vercel.app' }}
      # Nothing calls the icon detector yet, and exporting it means ten
      # minutes of Python setup on every release.
      SKRIM_SKIP_ICON: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome shows the manifest's version on chrome://extensions; take it
      # from the tag (v0.3.0 -> 0.3.0) instead of package.json's 0.0.0.
      - name: Stamp the version
        working-directory: apps/extension
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # Fetches the on-device models, then wxt zip writes
      # apps/extension/.output/<name>-<version>-chrome.zip.
      - name: Build the extension zip
        working-directory: apps/extension
        run: pnpm zip

      - name: Name the zip
        run: cp "$(ls apps/extension/.output/*-chrome.zip | head -1)" skrim-chrome.zip

      # wxt zip -b firefox also writes a -sources.zip for Mozilla's reviewers;
      # the add-on is the other one.
      - name: Build the Firefox zip
        working-directory: apps/extension
        run: pnpm zip:firefox

      - name: Name the Firefox zip
        run: cp "$(ls apps/extension/.output/*-firefox.zip | grep -v sources | head -1)" skrim-firefox.zip

      # Unlisted: signed for anyone to install from the file, not listed on
      # addons.mozilla.org. Skipped, and the release still goes out, without keys.
      - name: Sign for Firefox
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "No AMO_API_KEY / AMO_API_SECRET: the Firefox build stays unsigned."
            exit 0
          fi
          # pnpm dlx, not npx: npm refuses to run in this repo (package.json pins pnpm).
          pnpm dlx web-ext@10 sign --channel unlisted \
            --source-dir apps/extension/.output/firefox-mv3 --artifacts-dir signed \
            --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET"
          cp "$(ls signed/*.xpi | head -1)" skrim-firefox.xpi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skrim-chrome.zip
            skrim-firefox.zip
            skrim-firefox.xpi
          name: "Skrim ${{ github.ref_name }}"
          make_latest: true
          generate_release_notes: true
          body: |
            ## Install

            Skrim is not on the Chrome Web Store yet.

            1. Download **skrim-chrome.zip** below and unzip it.
            2. Open **chrome://extensions** in Chrome.
            3. Turn on **Developer mode** (top right).
            4. Click **Load unpacked** and choose the unzipped folder.
            5. Open any page and click Skrim's toolbar button.

            It plans with our hosted server, which is on a free tier shared by everyone
            trying it: a few steps a minute. To watch what the server receives, open the
            dashboard: ${{ env.WXT_DASHBOARD_URL }}

            ## Firefox, on a computer or on Android

            - **skrim-firefox.xpi** (when this release has it) is signed by Mozilla.
              Computer: open it in Firefox and confirm. Android: Settings → About
              Firefox → tap the logo five times; then Settings → Install add-on from
              file, and pick the .xpi. On Android, the toolbar button (in the menu,
              under Extensions) opens Skrim as a tab that works on the tab you came from.
            - **skrim-firefox.zip** is unsigned: `about:debugging` → This Firefox →
              Load Temporary Add-on, and pick the zip. It lasts until Firefox closes.

            To build from source, see the [README](https://github.com/letsbecool9792/skrim-hackspire#readme).
